<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exponential Probability Calculator</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #5d6779;
    --border: #d9dee7;
    --accent: #2563eb;
    --bar-other: #c4cad6;
    --arrow: #d62828;
    --on-accent: #ffffff;
    --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --card: #1b2029;
      --text: #e6e9ef;
      --muted: #9aa3b5;
      --border: #2f3746;
      --accent: #6b9bff;
      --bar-other: #3b4456;
      --arrow: #ff5c5c;
      --on-accent: #0b1020;
      --error: #ff8b7d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
  label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
  .hint { display: block; font-weight: 400; font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }
  input[type="number"] {
    width: 100%;
    padding: 9px 10px;
    font-size: 1rem;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  input[type="number"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #error { color: var(--error); min-height: 1.4em; margin: 12px 0 0; font-size: 0.9rem; }
  #results { margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--border); }
  th { font-weight: 600; color: var(--muted); font-size: 0.85rem; border-top: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, Consolas, monospace; }
  th.num { text-align: right; }
  tr.main td { font-weight: 700; }
  sup { line-height: 0; }   /* keep the pdf row the same height as the others */
  .stats { display: flex; gap: 24px; flex-wrap: wrap; color: var(--muted); font-size: 0.9rem; margin-top: 12px; }
  .stats b { color: var(--text); font-weight: 600; }
  canvas { width: 100%; height: 240px; display: block; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }
  .chart-note { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>Exponential Probability Calculator</h1>
  <p class="sub">X ~ Exponential(λ): an exponential distribution with rate λ (mean 1/λ).</p>

  <section class="card" aria-label="Inputs">
    <div class="inputs">
      <div>
        <label for="rate">Rate, λ <span class="hint">(greater than 0)</span></label>
        <input id="rate" type="number" min="0" step="0.1" value="1" inputmode="decimal">
      </div>
      <div>
        <label for="x">Value, x <span class="hint">(any number; X is never negative)</span></label>
        <input id="x" type="number" step="0.01" value="1" inputmode="decimal">
      </div>
    </div>
    <p id="error" role="alert"></p>
    <div class="stats" id="stats"></div>
    <div id="results" aria-live="polite" hidden>
      <table>
        <thead><tr><th>Quantity</th><th class="num">Value</th><th class="num">Percent</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section class="card" id="chartCard" hidden>
    <canvas id="chart" role="img" aria-label="Density curve of the exponential distribution, with the area up to x highlighted"></canvas>
    <div class="legend">
      <span><span class="sw" style="background:var(--accent)"></span>X ≤ x (the cumulative probability)</span>
      <span><span class="sw" style="background:var(--bar-other)"></span>X &gt; x</span>
    </div>
    <div class="chart-note" id="chartNote"></div>
  </section>
</main>

<script>
(function () {
  "use strict";

  // ---- Core math ----------------------------------------------------------
  // X ~ Exponential(rate): density f(t) = rate * exp(-rate * t) for t >= 0,
  //   P(X <= x) = 1 - exp(-rate * x)   and   P(X > x) = exp(-rate * x)   for x >= 0.
  // Math.expm1 keeps P(X <= x) accurate when rate * x is tiny (where
  // 1 - exp(-rate * x) would lose digits), and the upper tail is computed
  // directly so tiny probabilities keep their precision.
  function exponentialProbabilities(rate, x) {
    if (x <= 0) return { le: 0, gt: 1 };          // X is never negative
    var t = rate * x;
    return {
      le: -Math.expm1(-t),                        // P(X <= x) = 1 - exp(-rate*x)
      gt: Math.exp(-t)                            // P(X >  x) = 1 - P(X <= x), from the upper tail directly
    };
  }

  // ---- Formatting ---------------------------------------------------------
  // Table columns: 4 decimals for the value, 2 for the percent. Tiny nonzero
  // values would round to 0.0000 / 0.00%, so they are shown differently.
  function fmt(v) {
    if (v === 0) return "0";
    if (v === 1) return "1";
    if (v < 5e-5) return v.toExponential(4);
    return v.toFixed(4);
  }
  function fmtPct(v) {
    if (v === 0) return "0%";
    if (v < 5e-5) return "< 0.01%";
    return (v * 100).toFixed(2) + "%";
  }
  // Plain number with up to 6 significant digits and no trailing zeros.
  function num(v) {
    return String(Number(v.toPrecision(6)));
  }

  // ---- UI -----------------------------------------------------------------
  var el = {
    rate: document.getElementById("rate"),
    x: document.getElementById("x"),
    error: document.getElementById("error"),
    results: document.getElementById("results"),
    chartCard: document.getElementById("chartCard"),
    rows: document.getElementById("rows"),
    stats: document.getElementById("stats"),
    canvas: document.getElementById("chart"),
    chartNote: document.getElementById("chartNote")
  };

  var last = null;   // last successful calculation, used to redraw the chart on resize

  function readInputs() {
    var rateRaw = el.rate.value.trim(), xRaw = el.x.value.trim();
    if (rateRaw === "" || xRaw === "") return { error: "Enter values for λ and x." };
    var rate = Number(rateRaw), x = Number(xRaw);
    if (!isFinite(rate) || rate <= 0) return { error: "λ must be a number greater than 0." };
    if (!isFinite(x)) return { error: "x must be a number." };
    return { rate: rate, x: x };
  }

  function update() {
    var inp = readInputs();
    if (inp.error) {
      el.error.textContent = inp.error;
      el.stats.innerHTML = "";
      el.results.hidden = true;
      el.chartCard.hidden = true;
      last = null;
      return;
    }
    el.error.textContent = "";

    var rate = inp.rate, x = inp.x;
    var r = exponentialProbabilities(rate, x);

    // Each row: [label (HTML), value text, percent text, bold?]
    var density = x < 0 ? 0 : rate * Math.exp(-rate * x);     // f(x); a density, not a probability, so it has no percent
    var pdfLabel = x < 0 ? "pdf: f(" + num(x) + ") = 0"
                         : "pdf: f(" + num(x) + ") = λe<sup>\u2212λ(" + num(x) + ")</sup>";
    var rows = [
      ["CDF: P(X ≤ " + num(x) + ")", fmt(r.le), fmtPct(r.le), true],
      ["P(X > " + num(x) + ") = 1 − P(X ≤ " + num(x) + ")", fmt(r.gt), fmtPct(r.gt), false],
      [pdfLabel, fmt(density), "—", false]
    ];
    el.rows.innerHTML = "";
    rows.forEach(function (row) {
      var tr = document.createElement("tr");
      if (row[3]) tr.className = "main";
      [[row[0], ""], [row[1], "num"], [row[2], "num"]].forEach(function (c, i) {
        var td = document.createElement("td");
        if (i === 0) td.innerHTML = c[0]; else td.textContent = c[0];   // labels are built here from numbers only
        if (c[1]) td.className = c[1];
        tr.appendChild(td);
      });
      el.rows.appendChild(tr);
    });

    // For an exponential distribution the mean and the standard deviation are both 1/rate.
    el.stats.innerHTML = "<span>Mean = SD = 1/λ = <b>" + num(1 / rate) + "</b></span>";

    el.results.hidden = false;
    el.chartCard.hidden = false;
    last = { rate: rate, x: x };
    drawChart();
  }

  // ---- Chart: density curve, the area with X <= x highlighted --------------
  // A "nice" tick spacing (1, 2 or 5 times a power of ten) giving about 8 ticks.
  function niceStep(range) {
    var rough = range / 8, mag = Math.pow(10, Math.floor(Math.log10(rough)));
    var m = rough / mag;
    return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * mag;
  }

  function drawChart() {
    if (!last) return;
    var rate = last.rate, x = last.x, mean = 1 / rate;

    // Show 0 to 5 means (where nearly all the probability is), widened if
    // needed so that x (the boundary) is on the chart.
    var lo = 0, hi = 5 * mean;
    if (x < lo) lo = x - 0.5 * mean;
    if (x > hi) hi = x + 0.5 * mean;

    var css = getComputedStyle(document.documentElement);
    var cAccent = css.getPropertyValue("--accent").trim();
    var cOther = css.getPropertyValue("--bar-other").trim();
    var cText = css.getPropertyValue("--muted").trim();
    var cBorder = css.getPropertyValue("--border").trim();
    var cArrow = css.getPropertyValue("--arrow").trim();
    var cOnAccent = css.getPropertyValue("--on-accent").trim();
    var cLabel = css.getPropertyValue("--text").trim();

    var dpr = window.devicePixelRatio || 1;
    var W = el.canvas.clientWidth, H = el.canvas.clientHeight;
    el.canvas.width = Math.round(W * dpr);
    el.canvas.height = Math.round(H * dpr);
    var ctx = el.canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var padL = 46, padR = 24, padT = 10, padB = 30;   // padR leaves room for the last x label
    var plotW = W - padL - padR, plotH = H - padT - padB;

    function pdf(v) { return v < 0 ? 0 : rate * Math.exp(-rate * v); }
    var yMax = rate * 1.08;                           // the density is highest at 0, where it equals rate
    function sx(v) { return padL + (v - lo) / (hi - lo) * plotW; }
    function sy(f) { return padT + plotH - plotH * f / yMax; }
    var base = padT + plotH;

    // y axis grid + labels
    ctx.font = "12px system-ui, sans-serif";
    ctx.fillStyle = cText; ctx.strokeStyle = cBorder; ctx.lineWidth = 1;
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    var decimals = yMax >= 100 ? 0 : yMax >= 10 ? 1 : yMax < 0.01 ? 4 : (yMax < 0.1 ? 3 : 2);   // one precision for the whole axis
    for (var g = 0; g <= 4; g++) {
      var yv = yMax * g / 4, y = padT + plotH - plotH * g / 4;
      ctx.beginPath(); ctx.moveTo(padL, y + 0.5); ctx.lineTo(W - padR, y + 0.5); ctx.stroke();
      ctx.fillText(yv.toFixed(decimals), padL - 6, y);
    }

    // area under the curve: accent up to x, grey beyond it
    var STEPS = 400;
    function fillArea(from, to, color) {
      if (to <= from) return;
      ctx.beginPath();
      ctx.moveTo(sx(from), base);
      for (var i = 0; i <= STEPS; i++) {
        var v = from + (to - from) * i / STEPS;
        ctx.lineTo(sx(v), sy(pdf(v)));
      }
      ctx.lineTo(sx(to), base);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }
    var xc = Math.min(Math.max(x, lo), hi);
    fillArea(lo, xc, cAccent);
    fillArea(xc, hi, cOther);

    // curve outline and the boundary at x
    ctx.beginPath();
    for (var i = 0; i <= STEPS; i++) {
      var v = lo + (hi - lo) * i / STEPS;
      if (i === 0) ctx.moveTo(sx(v), sy(pdf(v))); else ctx.lineTo(sx(v), sy(pdf(v)));
    }
    ctx.strokeStyle = cAccent; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx(xc) + 0.5, base); ctx.lineTo(sx(xc) + 0.5, sy(pdf(xc)));
    ctx.strokeStyle = cText; ctx.lineWidth = 1; ctx.stroke();

    // Label + formula (exponent drawn raised and smaller) in a shaded area between pixel columns x0 and x1, as close to its
    // centre as will fit under the curve (moving left, where the curve is higher). With a heading it is two lines, falling
    // back to the formula alone; with head = "" it is the formula alone. Skipped when the area is too small.
    function areaLabel(head, line2, sup, x0, x1, color) {
      ctx.font = "bold 12px system-ui, sans-serif";
      var w2 = ctx.measureText(line2).width, wHead = ctx.measureText(head).width;
      ctx.font = "bold 9px system-ui, sans-serif";
      var wSup = ctx.measureText(sup).width;
      ctx.font = "bold 12px system-ui, sans-serif";
      var variants = [{ lines: 1, w: w2 + 1 + wSup, h: 17 }];
      if (head) variants.unshift({ lines: 2, w: Math.max(wHead, w2 + 1 + wSup), h: 34 });
      for (var vi = 0; vi < variants.length; vi++) {
        var w = variants[vi].w, h = variants[vi].h, left = null, bot;
        for (var l = (x0 + x1) / 2 - w / 2; l >= x0 + 8 - 0.5 && left === null; l -= 4) {
          var curveLow = sy(pdf(lo + (l + w - padL) / plotW * (hi - lo)));              // the curve is lowest at the box's right edge
          var b = Math.min((base + curveLow) / 2 + h / 2, base - 8);                    // centred between the axis and the curve
          if (l + w <= x1 - 4 && curveLow <= b - h - 2) { left = l; bot = b; }
        }
        if (left === null) continue;
        ctx.fillStyle = color; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
        if (variants[vi].lines === 2) ctx.fillText(head, left, bot - 18);
        ctx.fillText(line2, left, bot);
        ctx.font = "bold 9px system-ui, sans-serif";
        ctx.fillText(sup, left + w2 + 1, bot - 6);
        return;
      }
    }
    // the formulas show the actual value of x: e.g. x = 2.5 gives e^(−λ(2.5))
    var xs = num(x), expo = "\u2212λ(" + xs + ")";
    if (x >= 0) {                                                                      // (below 0 these formulas do not apply)
      areaLabel("CDF:", "1 \u2212 e", expo, sx(lo), sx(xc), cOnAccent);             // blue area: P(X ≤ x)
      areaLabel("", "e", expo, sx(xc), sx(hi), cLabel);                               // grey area: P(X > x), formula only
    }

    // red arrow pointing at the curve where x meets it, labelled f(x)
    var tx = sx(xc), ty = sy(pdf(xc));
    var len = 32, head = 8;
    ctx.font = "bold 13px system-ui, sans-serif";
    var LAB = x < 0 ? "f(" + xs + ") = 0" : "f(" + xs + ") = λe", SUP = x < 0 ? "" : expo;            // label, with the exponent drawn raised and smaller
    var labW = ctx.measureText(LAB).width;
    ctx.font = "bold 10px system-ui, sans-serif";
    var supW = ctx.measureText(SUP).width, fullW = labW + 1 + supW;
    ctx.font = "bold 13px system-ui, sans-serif";
    var fromRight = tx + len + 4 + fullW <= W - 2;   // else come in from above, where there is always room at the right edge
    var ax = fromRight ? tx + len : tx, ay = fromRight ? ty : ty - len;
    var ang = Math.atan2(ty - ay, tx - ax);
    ctx.strokeStyle = cArrow; ctx.fillStyle = cArrow; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(tx - Math.cos(ang) * head, ty - Math.sin(ang) * head); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - head * Math.cos(ang - 0.45), ty - head * Math.sin(ang - 0.45));
    ctx.lineTo(tx - head * Math.cos(ang + 0.45), ty - head * Math.sin(ang + 0.45));
    ctx.closePath(); ctx.fill();
    var lx = fromRight ? ax + 4 : Math.min(ax - fullW / 2, W - 2 - fullW);   // keep the label inside the canvas
    var ly = fromRight ? ay : ay - 3;
    ctx.textAlign = "left"; ctx.textBaseline = fromRight ? "middle" : "bottom";
    ctx.fillText(LAB, lx, ly);
    ctx.font = "bold 10px system-ui, sans-serif";
    ctx.fillText(SUP, lx + labW + 1, ly - 6);

    // x axis labels
    ctx.font = "12px system-ui, sans-serif";
    ctx.fillStyle = cText; ctx.textAlign = "center"; ctx.textBaseline = "top";
    var step = niceStep(hi - lo);
    var dec = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
    for (var t = Math.ceil(lo / step) * step; t <= hi + step * 1e-9; t += step) {
      var lab = t.toFixed(dec);
      if (Number(lab) === 0) lab = (0).toFixed(dec);   // no "-0"
      ctx.fillText(lab, sx(t), base + 6);
    }

    el.chartNote.textContent = "Showing x = " + num(lo) + " to " + num(hi) + ".  Actual range of x is 0 to ∞.";
  }

  ["rate", "x"].forEach(function (id) { el[id].addEventListener("input", update); });
  window.addEventListener("resize", drawChart);
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", drawChart);
  }

  // Exposed for testing in the console: e.g. exponentialCdf(1, 1)
  window.exponentialCdf = function (rate, x) { return exponentialProbabilities(rate, x).le; };

  update();
})();
</script>
</body>
</html>
